<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Objects</title>
</head>
<body>
    <script>
         const person = {
            firstName: "Devika",
            lastName: "Nookala",
            age: 30,
            isEmployed: true,
         }

         console.log(person.firstName);
         console.log(person.lastName);
         console.log(person.age);
         console.log(person.isEmployed);

    </script>
</body>
</html>
