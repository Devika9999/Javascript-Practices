<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This Keyword</title>
</head>
<body>
    <script>
        const person = {
            name: "Devika",
            favFood: "Biryani",
            sayHello: function() {
                console.log(`Hi! I am ${this.name}`)
            }
        }
        person.sayHello();
    </script>
    
</body>
</html>
